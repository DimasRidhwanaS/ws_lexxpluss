# Costmap Configuration for Exploration with SLAM

global_costmap:
    global_frame: map
    robot_base_frame: base_footprint
    robot_radius: 0.22
    footprint: '[]'
    footprint_padding: 0.01
    update_frequency: 1.0
    publish_frequency: 0.5
    transform_tolerance: 0.5

    static_map: false
    rolling_window: false

    plugins:
        - {name: static_layer, type: "costmap_2d::StaticLayer"}
        - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
        - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

    static_layer:
        map_topic: /map
        first_map_only: false
        subscribe_to_updates: true
        track_unknown_space: true
        use_maximum: false
        trinary_costmap: true

    obstacle_layer:
        observation_sources: laser_scan_sensor
        laser_scan_sensor:
            sensor_frame: lidar_link
            data_type: LaserScan
            topic: scan
            marking: true
            clearing: true
            obstacle_range: 5.5
            raytrace_range: 6.0
            inf_is_valid: true
        footprint_clearing_enabled: true
        combination_method: 1
        max_obstacle_height: 2.0

    inflation_layer:
        cost_scaling_factor: 10.0
        inflation_radius: 0.7
        inflate_unknown: false

local_costmap:
    global_frame: odom
    robot_base_frame: base_footprint
    robot_radius: 0.22
    footprint: '[]'
    footprint_padding: 0.01
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.5

    static_map: false
    rolling_window: true
    width: 5.0
    height: 5.0
    resolution: 0.025
    origin_x: -2.5
    origin_y: -2.5

    plugins:
        - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
        - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

    obstacle_layer:
        observation_sources: laser_scan_sensor
        laser_scan_sensor:
            sensor_frame: lidar_link
            data_type: LaserScan
            topic: scan
            marking: true
            clearing: true
            obstacle_range: 3.0
            raytrace_range: 3.5
        footprint_clearing_enabled: true
        combination_method: 1
        max_obstacle_height: 2.0

    inflation_layer:
        cost_scaling_factor: 10.0
        inflation_radius: 0.7
        inflate_unknown: false