# GMapping Configuration

# Frames
map_frame: map
odom_frame: odom
base_frame: base_footprint

# Map update
map_update_interval: 0.5
resolution: 0.05

# Range
maxUrange: 30.0
maxRange: 30.0

# Particle filter parameters
sigma: 0.05
kernelSize: 1
lstep: 0.05
astep: 0.05
iterations: 5
lsigma: 0.075
ogain: 3.0
lskip: 0

# Motion model
srr: 0.1
srt: 0.2
str: 0.1
stt: 0.2

# Update thresholds (lower = more frequent updates)
linearUpdate: 0.5
angularUpdate: 0.25
temporalUpdate: 0.5

# Resampling
resampleThreshold: 0.5
particles: 30

# Map size (larger for warehouse)
xmin: -25.0
ymin: -25.0
xmax: 25.0
ymax: 25.0
delta: 0.05

# Score (lower = easier scan matching)
minimumScore: 0.0