# Global Costmap (rolling window, no static map)
global_costmap:
    global_frame: map
    robot_base_frame: base_footprint
    robot_radius: 0.22
    footprint: '[]'
    footprint_padding: 0.01
    update_frequency: 1.0
    publish_frequency: 0.5

    static_map: false
    rolling_window: true

    width: 20.0
    height: 20.0
    resolution: 0.05
    origin_x: -10.0
    origin_y: -10.0
    transform_tolerance: 0.5

    plugins:
        - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
        - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

    obstacle_layer:
        enabled: true
        combination_method: 1
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        observation_sources: laser_scan_sensor
        laser_scan_sensor:
            sensor_frame: lidar_link
            data_type: LaserScan
            topic: scan
            marking: true
            clearing: true
            obstacle_range: 5.5
            raytrace_range: 6.0
            inf_is_valid: true

    inflation_layer:
        enabled: true
        cost_scaling_factor: 10.0
        inflation_radius: 0.7
        inflate_unknown: false

# Local Costmap (for local planner)
local_costmap:
    global_frame: odom
    robot_base_frame: base_footprint
    robot_radius: 0.22
    footprint: '[]'
    footprint_padding: 0.01
    update_frequency: 5.0
    publish_frequency: 2.0

    static_map: false
    rolling_window: true

    width: 5.0
    height: 5.0
    resolution: 0.025
    origin_x: -2.5
    origin_y: -2.5
    transform_tolerance: 0.5

    plugins:
        - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
        - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

    obstacle_layer:
        enabled: true
        combination_method: 1
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        observation_sources: laser_scan_sensor
        laser_scan_sensor:
            sensor_frame: lidar_link
            data_type: LaserScan
            topic: scan
            marking: true
            clearing: true
            obstacle_range: 3.0
            raytrace_range: 3.5

    inflation_layer:
        enabled: true
        cost_scaling_factor: 10.0
        inflation_radius: 0.7
        inflate_unknown: false