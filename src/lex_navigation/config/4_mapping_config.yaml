# GMapping Configuration

# Frames
map_frame: map
odom_frame: odom
base_frame: base_footprint

# Map update
map_update_interval: 1.0
resolution: 0.05

# Range
maxUrange: 30.0
maxRange: 30.0

# Particle filter parameters
sigma: 0.05
kernelSize: 1
lstep: 0.05
astep: 0.05
iterations: 5
lsigma: 0.075
ogain: 3.0
lskip: 0

# Motion model
srr: 0.1
srt: 0.2
str: 0.1
stt: 0.2

# Update thresholds
linearUpdate: 1.0
angularUpdate: 0.5
temporalUpdate: -1.0

# Resampling
resampleThreshold: 0.5
particles: 30

# Map size
xmin: -10.0
ymin: -10.0
xmax: 10.0
ymax: 10.0
delta: 0.05

# Score
minimumScore: 50.0